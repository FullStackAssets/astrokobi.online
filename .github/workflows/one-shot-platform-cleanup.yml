name: One-shot platform cleanup
on:
  push:
    branches: [agent/remove-platform-coupling]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove retired hosting integration'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Remove non-workflow integration residue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          r=Path('.'); d=(r/'CNAME').read_text().strip(); c=f'https://{d}'
          p=r/'vercel.json'; p.exists() and p.unlink()
          p=r/'package.json'; j=json.loads(p.read_text())
          for s in ('dependencies','devDependencies','optionalDependencies'):
            j.get(s,{}).pop('@vercel/analytics',None); j.get(s,{}).pop('@vercel/speed-insights',None)
          p.write_text(json.dumps(j,indent=2)+'\n')
          ok={'.md','.mdx','.txt','.ts','.tsx','.js','.mjs','.cjs','.json','.sh'}
          for p in r.rglob('*'):
            if not p.is_file() or any(x in p.parts for x in ('.git','node_modules','.next','out','dist')) or ('.github' in p.parts and 'workflows' in p.parts) or p.name=='package-lock.json' or (p.suffix not in ok and p.name not in {'.env.example','.env.production'}): continue
            try: t=p.read_text()
            except UnicodeDecodeError: continue
            t=re.sub(r"^import \{ (?:Analytics|SpeedInsights) \} from '@vercel/(?:analytics|speed-insights)/next';\n",'',t,flags=re.M)
            t=re.sub(r'^\s*<(?:Analytics|SpeedInsights)\s*/>\n','',t,flags=re.M)
            t=re.sub(r'https://[^\s\)\]"\']*\.vercel\.app[^\s\)\]"\']*',c,t,flags=re.I)
            t=t.replace('vercel.json','.github/workflows/pages.yml').replace('Vercel KV / Redis','a shared Redis-compatible store').replace('Vercel Cron','the repository scheduler').replace('Vercel','GitHub Pages')
            t=re.sub(r'\bvercel\b','static hosting',t,flags=re.I); p.write_text(t)
          p=r/'.gitignore'
          if p.exists(): p.write_text('\n'.join(x for x in p.read_text().splitlines() if '.vercel' not in x.lower())+'\n')
          PY
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Verify static production build
        run: |
          domain="$(tr -d '\r\n' < CNAME)"
          NEXT_PUBLIC_SITE_URL="https://${domain}" npm run build
          test -f out/index.html
      - name: Verify and commit non-workflow cleanup
        shell: bash
        run: |
          ! grep -RinI --exclude-dir=.git --exclude-dir=.github/workflows --exclude='*.pdf' 'vercel' .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows'
          git diff --cached --quiet && exit 0
          git commit -m "Remove retired hosting integration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
